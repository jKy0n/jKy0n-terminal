#
#        Title:      tmux.conf
#        Brief:      Arquivo principal — carrega os módulos de conf.d/ e o TPM
#

source-file ~/.config/tmux/conf.d/base.conf
source-file ~/.config/tmux/conf.d/keys.conf
source-file ~/.config/tmux/conf.d/plugins.conf
source-file ~/.config/tmux/conf.d/theme.conf

# TPM por último: precisa que plugins.conf já tenha declarado os @plugin
run '~/.config/tmux/plugins/tpm/tpm'
